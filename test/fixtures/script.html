<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Script</title>
<script src="js/app.js"></script>
</head>
<body>
  <h1>Script</h1>
  <p id="out">JavaScript did not run</p>
  <button id="btn" onclick="document.getElementById('out').textContent = 'clicked'">Click</button>
  <script>
    document.addEventListener('DOMContentLoaded', () => { window.appInit && window.appInit(); });
  </script>
</body>
</html>
